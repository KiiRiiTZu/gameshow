<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gameshow</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main class="shell landing">
    <section class="card hero-card">
      <p class="eyebrow">GAMESHOW · V0.1</p>
      <h1>Bereit für die Show?</h1>
      <p class="muted">Moderator erstellt einen Raum. Spieler treten mit dem Raumcode bei.</p>

      <div class="choice-grid">
        <a class="button primary big" href="./host.html">Raum erstellen</a>

        <form id="join-form" class="join-box">
          <label for="room-code">Raumcode</label>
          <input id="room-code" maxlength="6" autocomplete="off" placeholder="ABCD" />
          <button class="button secondary" type="submit">Als Spieler beitreten</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("join-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const code = document.getElementById("room-code").value.trim().toUpperCase();
      if (!code) return;
      window.location.href = `./player.html?room=${encodeURIComponent(code)}`;
    });
  </script>
</body>
</html>
